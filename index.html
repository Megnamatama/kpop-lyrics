<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-POPで韓国語</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0d0d12;color:#e8e6e3;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{text-align:center;padding:24px;width:100%;max-width:360px}
.icon{font-size:64px;margin-bottom:16px}
h1{font-size:22px;font-weight:800;background:linear-gradient(135deg,#7c3aed,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.sub{font-size:13px;color:#8a8a9a;margin-bottom:32px}
.input-wrap{position:relative;margin-bottom:16px}
input{width:100%;padding:14px 16px;background:#16161e;border:1px solid #2a2a3a;border-radius:12px;color:#e8e6e3;font-size:15px;outline:none;transition:border-color .2s}
input:focus{border-color:#a78bfa}
input::placeholder{color:#8a8a9a}
button{width:100%;padding:14px;background:linear-gradient(135deg,#7c3aed,#a78bfa);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.97)}
.error{color:#ef4444;font-size:12px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="container">
<div class="icon">🎵</div>
<h1>K-POPで韓国語</h1>
<p class="sub">パスワードを入力してね</p>
<div class="input-wrap">
<input type="password" id="pw" placeholder="パスワード" autofocus
  onkeydown="if(event.key==='Enter')submit()">
</div>
<button onclick="submit()">入る</button>
<p class="error" id="err">パスワードが違うよ！</p>
</div>
<script>
async function sha256(text){
  const data=new TextEncoder().encode(text);
  const buf=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function submit(){
  const pw=document.getElementById('pw').value;
  if(!pw)return;
  const hash=await sha256(pw);
  try{
    const res=await fetch(hash+'/index.html',{method:'HEAD'});
    if(res.ok){window.location.href=hash+'/';}
    else{document.getElementById('err').style.display='block';}
  }catch(e){document.getElementById('err').style.display='block';}
}
</script>
</body>
</html>
