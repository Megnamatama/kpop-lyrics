<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-POP 歌詞プレイヤー</title>
<style>
:root {
  --bg: #0d0d12; --bg2: #16161e; --bg3: #1e1e2a;
  --text: #e8e6e3; --text-dim: #8a8a9a; --accent: #a78bfa; --accent2: #7c3aed;
  --noun: #f472b6; --particle: #6ba3ff; --verb: #34d399; --adj: #fbbf24;
  --adv: #fb923c; --pronoun: #38bdf8; --ending: #a78bfa; --eng: #94a3b8;
  --border: #2a2a3a;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
  padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f5f7; --bg2: #fff; --bg3: #eeeef2;
    --text: #1a1a2e; --text-dim: #6b6b7b; --border: #d4d4dd;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d12; --bg2: #16161e; --bg3: #1e1e2a;
  --text: #e8e6e3; --text-dim: #8a8a9a; --border: #2a2a3a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:var(--safe-top);overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding-bottom:160px}
.header{background:linear-gradient(135deg,#7c3aed 0%,#a78bfa 50%,#f472b6 100%);padding:18px 16px 14px;text-align:center}
.header h1{font-size:18px;font-weight:800;color:#fff;letter-spacing:1px}
.header .song-info{font-size:12px;color:rgba(255,255,255,.85);margin-top:3px}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);position:-webkit-sticky;position:sticky;top:0;z-index:50}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--text-dim);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:44px;z-index:40}
.legend-item{font-size:9px;padding:2px 7px;border-radius:4px;font-weight:600}
.lyrics-container{padding:6px 10px}
.lyric-line{background:var(--bg2);border-radius:10px;padding:10px;margin-bottom:6px;border:1px solid var(--border);transition:border-color .3s,box-shadow .3s;contain:content}
.lyric-line.active{border-color:var(--accent);box-shadow:0 0 12px rgba(167,139,250,.25);opacity:1}
.lyric-line.future{opacity:.65}
.lyric-line.past{opacity:.25}
.words-row{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
.word-block{text-align:center;padding:3px 1px;min-width:20px;transition:transform .15s,filter .15s}
.word-block.word-active .word-text{box-shadow:0 0 8px 2px currentColor;transition:box-shadow .15s}
.word-reading{font-size:10px;color:var(--text-dim);margin-bottom:1px;line-height:1.2}
.word-text{font-size:18px;font-weight:700;padding:3px 6px;border-radius:5px;display:inline-block;line-height:1.3}
.word-meaning{font-size:9px;margin-top:1px;line-height:1.2}
.pos-noun .word-text{background:rgba(244,114,182,.2);color:var(--noun)}.pos-noun .word-meaning{color:var(--noun)}
.pos-particle .word-text{background:rgba(107,163,255,.2);color:var(--particle)}.pos-particle .word-meaning{color:var(--particle)}
.pos-verb .word-text{background:rgba(52,211,153,.2);color:var(--verb)}.pos-verb .word-meaning{color:var(--verb)}
.pos-adj .word-text{background:rgba(251,191,36,.2);color:var(--adj)}.pos-adj .word-meaning{color:var(--adj)}
.pos-adv .word-text{background:rgba(251,146,60,.2);color:var(--adv)}.pos-adv .word-meaning{color:var(--adv)}
.pos-pronoun .word-text{background:rgba(56,189,248,.2);color:var(--pronoun)}.pos-pronoun .word-meaning{color:var(--pronoun)}
.pos-ending .word-text{background:rgba(167,139,250,.2);color:var(--ending)}.pos-ending .word-meaning{color:var(--ending)}
.pos-eng .word-text{background:rgba(148,163,184,.12);color:var(--eng)}.pos-eng .word-meaning{color:var(--eng)}
.line-translation{font-size:11px;color:var(--text-dim);padding-top:3px}
.line-bg{font-size:10px;color:var(--accent);opacity:.55;padding-top:2px;font-style:italic}
.player-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);padding:6px 14px calc(6px + var(--safe-bottom));z-index:100}
.progress-wrap{width:100%;height:24px;display:flex;align-items:center;cursor:pointer;touch-action:none;position:relative}
.progress-bg{width:100%;height:4px;background:var(--bg3);border-radius:2px;position:relative}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;width:0%;will-change:width;transform:translateZ(0)}
.player-controls{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.time-display{font-size:10px;color:var(--text-dim);font-variant-numeric:tabular-nums;min-width:32px}
.play-btn{width:48px;height:48px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.ctrl-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:12px;font-size:11px;cursor:pointer}
#audioFileInput{display:none}
.section-pad{padding:10px 12px}
.section-pad h3{font-size:13px;margin-bottom:8px;color:var(--accent)}
.e-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:6px}
.e-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.e-num{font-size:10px;color:var(--text-dim)}
.e-preview{font-size:12px;margin-bottom:3px}
.e-trans{font-size:10px;color:var(--text-dim)}
.e-input{width:100%;padding:7px 9px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;margin-bottom:5px}
.e-input::placeholder{color:var(--text-dim)}
select.e-input{-webkit-appearance:none;appearance:none}
.btn-row{display:flex;gap:5px;flex-wrap:wrap}
.btn-s{padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:11px;cursor:pointer}
.btn-s.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-s.dan{background:#ef4444;color:#fff;border-color:#ef4444}
.word-chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.w-chip{font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;display:flex;align-items:center;gap:3px}
.w-chip.sel{border-color:var(--accent);background:rgba(167,139,250,.15)}
.w-chip .arr{font-size:9px;padding:1px 3px;cursor:pointer;color:var(--accent)}
.t-line{display:flex;align-items:center;gap:6px;padding:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:5px;font-size:12px}
.t-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-time-input{width:55px;text-align:center;padding:3px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--accent);font-size:10px;font-variant-numeric:tabular-nums}
.t-btn{padding:3px 8px;border-radius:5px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:10px;cursor:pointer;white-space:nowrap}
.t-btn:active{background:var(--accent);color:#fff}
.sub-tabs{display:flex;gap:0;margin-bottom:8px}
.sub-tab{flex:1;padding:8px;text-align:center;font-size:11px;font-weight:600;color:var(--text-dim);background:var(--bg3);border:1px solid var(--border);cursor:pointer}
.sub-tab:first-child{border-radius:8px 0 0 8px}
.sub-tab:last-child{border-radius:0 8px 8px 0}
.sub-tab.active{color:var(--accent);background:rgba(167,139,250,.1);border-color:var(--accent)}
.song-item{display:flex;align-items:center;gap:6px;padding:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer;font-size:12px}
.song-item.current{border-color:var(--accent)}
.song-item .s-name{flex:1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg2);border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto}
.modal h3{font-size:15px;margin-bottom:10px;color:var(--accent)}
.modal textarea{width:100%;min-height:150px;padding:10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;resize:vertical}
.home-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;transition:border-color .2s,transform .15s}
.home-card:active{transform:scale(.98);border-color:var(--accent)}
.home-card .hc-title{font-size:15px;font-weight:700;margin-bottom:2px}
.home-card .hc-artist{font-size:12px;color:var(--text-dim)}
.back-btn{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;padding:8px 12px}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'▸ ';color:var(--accent)}
details[open] summary::before{content:'▾ '}
.legend-item{cursor:pointer;transition:opacity .2s}
.legend-item.off{opacity:.3}
.loop-btn{padding:3px 6px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text-dim);font-size:10px;cursor:pointer}
.loop-btn.on{color:var(--accent);border-color:var(--accent);background:rgba(167,139,250,.12)}
.ab-indicator{font-size:9px;color:var(--accent);font-variant-numeric:tabular-nums}
.opt-toggle{background:none;border:none;color:var(--text-dim);font-size:10px;cursor:pointer;padding:2px 6px}
.menu-btn{background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer;padding:11px 12px;letter-spacing:1px}
.menu-drop{position:absolute;right:0;top:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;z-index:55;min-width:140px;box-shadow:0 4px 16px rgba(0,0,0,.3);display:none}
.menu-drop.open{display:block}
.menu-item{display:block;width:100%;padding:10px 14px;text-align:left;font-size:12px;color:var(--text);background:none;border:none;border-bottom:1px solid var(--border);cursor:pointer}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:var(--bg3)}
.opt-panel{overflow:hidden;max-height:0;transition:max-height .25s ease;margin-top:0}
.opt-panel.open{max-height:120px;margin-top:4px}
.word-block.pos-hidden .word-reading,.word-block.pos-hidden .word-meaning{visibility:hidden}
.help-sec{margin-bottom:32px}.help-sec h3{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
.help-sec h4{font-size:13px;font-weight:700;color:var(--text);margin:18px 0 8px;padding-left:4px;border-left:3px solid var(--accent)}
.help-sec p,.help-sec li{font-size:12.5px;color:var(--text);line-height:1.8;padding:0 4px}
.help-sec ul{padding-left:22px;margin:6px 0}
.hex{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:10px 0;font-size:12.5px;line-height:2.1}
.hex .kr{font-size:16px;font-weight:700;color:var(--accent)}.hex .arrow{color:var(--text-dim);margin:0 6px}
.hex .mean{color:var(--text-dim);font-size:11px}
.hex-row{display:flex;align-items:center;gap:6px;padding:3px 0;flex-wrap:wrap}
.help-nav-btn{padding:5px 12px;border-radius:14px;border:1px solid var(--border);background:var(--bg2);color:var(--text-dim);font-size:11px;white-space:nowrap;cursor:pointer;flex-shrink:0}
.help-nav-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.mv-panel{background:var(--bg3);border-bottom:1px solid var(--border);overflow:hidden;position:sticky;top:77px;z-index:35}
.mv-toggle{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;font-size:11px;color:var(--text-dim);cursor:pointer;background:none;border:none;width:100%}
.mv-video-wrap{max-height:0;overflow:hidden;transition:max-height .3s ease}
.mv-video-wrap.open{max-height:160px}
.mv-video-wrap video{width:100%;height:160px;display:block;object-fit:contain;background:#000;cursor:pointer}

</style>
</head>
<body>
<div class="app" id="app">
  <div class="header" style="position:relative">
    <h1>K-POPで韓国語</h1>
    <button onclick="showHelp()" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:16px;color:#fff;font-size:11px;padding:5px 10px;cursor:pointer;font-weight:600">📖 ヘルプ</button>
    <div class="song-info" id="songTitle"></div>
  </div>
  <!-- HOME screen -->
  <div id="homeScreen">
    <div style="text-align:center;padding:30px 16px 10px">
      <div style="font-size:48px;margin-bottom:8px">🎵</div>
      <p style="font-size:14px;color:var(--text);font-weight:600;margin-bottom:4px">曲を選んでスタート！</p>
      <p style="font-size:11px;color:var(--text-dim)">歌詞を見ながら韓国語を学ぼう</p>
      <p style="font-size:9px;color:var(--text-dim);opacity:.5;margin-top:8px">🔧 10/27: 読み込み高速化・iOSハイライト先読み・スロー音質修正・品詞フィルター改良</p>

    </div>
    <div class="section-pad" id="homeSongList">
      <div style="text-align:center;padding:20px;color:var(--text-dim);font-size:12px">📡 読み込み中...</div>
    </div>
  </div>
  <!-- PLAYER screen (hidden initially) -->
  <div id="playerScreen" style="display:none">
    <div class="tabs">
      <button class="tab active" data-tab="play" onclick="switchTab('play')">再生</button>
      <button class="tab" data-tab="songs" onclick="switchTab('songs')">曲リスト</button>
      <div style="position:relative">
        <button class="menu-btn" onclick="toggleMenu()">⋮</button>
        <div class="menu-drop" id="menuDrop">
          <button class="menu-item" onclick="switchTab('edit');closeMenu()">📝 歌詞編集</button>
          <button class="menu-item" onclick="switchTab('timing');closeMenu()">⏱ タイミング</button>
          <button class="menu-item" onclick="exportAllData();closeMenu()">📋 データコピー</button>
        </div>
      </div>
    </div>
    <div class="tab-content" id="tab-play">
      <div class="legend" id="legend"></div>
      <div class="mv-panel" id="mvPanel" style="display:none">
        <button class="mv-toggle" onclick="toggleMVPanel()"><span id="mvToggleIcon">▸</span> 🎬 MV</button>
        <div class="mv-video-wrap" id="mvVideoWrap"></div>
      </div>
      <div class="lyrics-container" id="lyricsDisplay"></div>
    </div>
    <div class="tab-content" id="tab-edit" style="display:none">
      <div class="section-pad">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <h3 style="margin:0">歌詞ライン</h3>
          <div class="btn-row">
            <button class="btn-s pri" onclick="showPasteModal()">📋 貼り付け</button>
            <button class="btn-s" onclick="addNewLine()">＋ 行追加</button>
          </div>
        </div>
        <div id="editLines"></div>
      </div>
    </div>
    <div class="tab-content" id="tab-timing" style="display:none">
      <div class="section-pad">
        <div class="sub-tabs">
          <div class="sub-tab active" onclick="setTimingMode('line')">行タイミング</div>
          <div class="sub-tab" onclick="setTimingMode('word')">単語タイミング</div>
        </div>
        <p style="font-size:10px;color:var(--text-dim);margin-bottom:6px">MP3再生中にTAPを押すと現在位置を記録。手入力も可（例: 1:23）</p>
        <div id="timingContent"></div>
      </div>
    </div>
    <div class="tab-content" id="tab-songs" style="display:none">
      <div class="section-pad">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h3 style="margin:0">曲リスト</h3>
          <button class="back-btn" onclick="goHome()">← ホームに戻る</button>
        </div>
        <div id="songList" style="margin-top:8px"></div>
        <button class="btn-s" style="margin-top:8px;width:100%;padding:10px" onclick="loadFromSheets()">🔄 スプレッドシートから再読み込み</button>
        <p style="font-size:10px;color:var(--text-dim);margin-top:6px">新しい曲はスプレッドシートに追加すると反映されます</p>
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
          <h3>MP3の状態</h3>
          <div id="mp3Status" style="font-size:11px;color:var(--text-dim);margin-top:6px"></div>
        </div>
        <div id="exportStatus" style="font-size:11px;color:var(--accent);margin-top:6px;display:none"></div>
      </div>
    </div>
  </div>
<div class="player-bar">
  <div id="playerUI">
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bg"><div class="progress-fill" id="progressFill"></div></div>
      <div id="seekTooltip" style="position:absolute;top:-28px;left:0;background:var(--accent);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;pointer-events:none;display:none;font-variant-numeric:tabular-nums;white-space:nowrap"></div>
    </div>
    <div class="player-controls">
      <span class="time-display" id="currentTime">0:00.00</span>
      <button class="ctrl-btn" onclick="skip(-5)" style="font-size:14px;padding:6px 12px">-5s</button>
      <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" onclick="skip(5)" style="font-size:14px;padding:6px 12px">+5s</button>
      <span class="time-display" id="totalTime">0:00.00</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px">
      <button class="ctrl-btn" onclick="document.getElementById('audioFileInput').click()" style="font-size:10px">🎵 MP3</button>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="ctrl-btn" onclick="changeSpeed(-1)" style="font-size:12px;padding:3px 6px">🐢</button>
        <span class="time-display" id="speedDisplay" style="min-width:28px;text-align:center;font-weight:600;font-size:11px">1×</span>
        <button class="ctrl-btn" onclick="changeSpeed(1)" style="font-size:12px;padding:3px 6px">🐇</button>
      </div>
      <button class="opt-toggle" id="optToggle" onclick="toggleOpt()">⚙ more</button>
    </div>
    <div class="opt-panel" id="optPanel">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 0">
        <button class="loop-btn" id="loopBtn" onclick="toggleLoop()">🔁 ループ</button>
        <button class="loop-btn" id="abBtn" onclick="toggleAB()">🅰️🅱️ 区間</button>
        <span class="ab-indicator" id="abInfo"></span>
      </div>
    </div>
  </div>
</div>
<input type="file" id="audioFileInput" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac">
<audio id="audioPlayer"></audio>
<div id="modalRoot"></div>
<!-- HELP screen -->
<div id="helpScreen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:300;overflow-y:auto;-webkit-overflow-scrolling:touch">
  <div style="position:sticky;top:0;background:var(--bg);z-index:10;padding:env(safe-area-inset-top,0) 16px 0;border-bottom:1px solid var(--border)">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0">
      <button onclick="closeHelp()" style="background:none;border:none;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer">← 戻る</button>
      <span style="font-size:15px;font-weight:700;color:var(--text)">📖 韓国語ヘルプ</span>
      <span style="width:40px"></span>
    </div>
    <div id="helpNav" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch"></div>
  </div>
  <div style="padding:16px;max-width:480px;margin:0 auto" id="helpBody"></div>
</div>

<script>
const POS={noun:{l:'名詞',c:'#f472b6',bg:'rgba(244,114,182,.2)'},particle:{l:'助詞',c:'#60a5fa',bg:'rgba(96,165,250,.2)'},verb:{l:'動詞',c:'#34d399',bg:'rgba(52,211,153,.2)'},adj:{l:'形容詞',c:'#fbbf24',bg:'rgba(251,191,36,.2)'},adv:{l:'副詞',c:'#fb923c',bg:'rgba(251,146,60,.2)'},pronoun:{l:'代名詞',c:'#38bdf8',bg:'rgba(56,189,248,.2)'},ending:{l:'語尾',c:'#a78bfa',bg:'rgba(167,139,250,.2)'},eng:{l:'英語',c:'#94a3b8',bg:'rgba(148,163,184,.12)'}};
const W=()=>({text:'',reading:'',meaning:'',pos:'noun',time:null});

// Google Sheets config
const SHEET_ID='1nlVHLi43foVRPKqaDyYR-BJfgoySKuBlBYTO08vK6Ss';
function csvURL(name){return`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`}

let songs=[];

// Parse CSV text into array of objects using header row
function parseCSV(text){
  const lines=text.split('\n').filter(l=>l.trim());
  if(lines.length<2)return[];
  function splitRow(line){
    const result=[];let cur='';let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++}else{inQ=!inQ}}
      else if(c===','&&!inQ){result.push(cur);cur=''}
      else{cur+=c}}
    result.push(cur);return result}
  const headers=splitRow(lines[0]).map(h=>h.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line=>{
    const vals=splitRow(line);
    const obj={};headers.forEach((h,i)=>{obj[h]=vals[i]?vals[i].replace(/^"|"$/g,''):''});return obj})}

// Load songs list from 'songs' sheet, then load each song's lyrics
async function loadFromSheets(){
  try{
    document.getElementById('lyricsDisplay').innerHTML='<div style="text-align:center;padding:40px;color:var(--text-dim)">📡 スプレッドシートから読み込み中...</div>';
    const res=await fetch(csvURL('songs'));
    if(!res.ok)throw new Error('songs fetch failed: '+res.status);
    const txt=await res.text();
    const rows=parseCSV(txt);
    if(!rows.length){document.getElementById('lyricsDisplay').innerHTML='<div style="text-align:center;padding:40px;color:var(--text-dim)">曲データがありません</div>';return}
    songs=rows.map(r=>({id:r.id||'',title:r.title||'',artist:r.artist||'',album:r.album||'',videoUrl:r.video_url||'',videoOffset:parseFloat(r.video_offset)||0,lines:[]}));
    // Load all songs' lyrics in parallel
    await Promise.all(songs.map(async(song,i)=>{
      try{
        const r2=await fetch(csvURL(song.id));
        if(!r2.ok)throw new Error('song fetch failed: '+r2.status);
        const t2=await r2.text();
        const lRows=parseCSV(t2);
        const lineMap={};
        lRows.forEach(r=>{
          const ln=parseInt(r.line)||0;if(!ln)return;
          if(!lineMap[ln])lineMap[ln]={words:[],lineTime:null,translation:'',bgText:''};
          const lt=parseFloat(r.line_time);if(!isNaN(lt))lineMap[ln].lineTime=lt;
          if(r.translation)lineMap[ln].translation=r.translation;
          if(r.bg_text)lineMap[ln].bgText=r.bg_text;
          const wt=parseFloat(r.word_time);
          lineMap[ln].words.push({text:r.text||'',reading:r.reading||'',meaning:r.meaning||'',pos:r.pos||'noun',time:isNaN(wt)?null:wt})});
        songs[i].lines=Object.keys(lineMap).sort((a,b)=>a-b).map(k=>({time:lineMap[k].lineTime,translation:lineMap[k].translation,bgText:lineMap[k].bgText,words:lineMap[k].words}));
      }catch(e){console.warn('Failed to load song:',song.id,e)}
    }));
    // Merge saved timing data from localStorage
    loadTimings();
    renderHome();
  }catch(e){
    console.error('Sheet load error:',e);
    document.getElementById('lyricsDisplay').innerHTML='<div style="text-align:center;padding:40px;color:var(--text-dim)">❌ 読み込み失敗<br><span style="font-size:10px">'+e.message+'</span><br><button class="btn-s pri" style="margin-top:10px" onclick="loadFromSheets()">再試行</button></div>';
  }
}

// DB for MP3
function openDB(){return new Promise((r,j)=>{const q=indexedDB.open('kpop-v2',1);q.onupgradeneeded=e=>e.target.result.createObjectStore('audio');q.onsuccess=e=>r(e.target.result);q.onerror=j})}
async function saveAudioDB(id,file){try{const db=await openDB(),tx=db.transaction('audio','readwrite'),buf=await file.arrayBuffer();tx.objectStore('audio').put({data:buf,name:file.name,type:file.type},id);await new Promise(r=>{tx.oncomplete=r})}catch(e){console.warn(e)}}
async function loadAudioDB(id){try{const db=await openDB(),tx=db.transaction('audio','readonly');return new Promise(r=>{const q=tx.objectStore('audio').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}

let mp3Loaded=false;
async function checkMP3(){const el=document.getElementById('mp3Status');if(!el)return;if(mp3Loaded){el.textContent='✅ MP3読み込み済み';return}const d=await loadAudioDB(songs[curSong].id);el.textContent=d?`✅ MP3保存済み（${d.name}）`:'🎵 MP3を読み込んでね！下のMP3ボタンをタップ'}
async function tryLoadAudio(){const d=await loadAudioDB(songs[curSong].id);if(d){const b=new Blob([d.data],{type:d.type});audio.src=URL.createObjectURL(b);audio.load();mp3Loaded=true}else{audio.src='';mp3Loaded=false}checkMP3()}

// Timing data: save only timing to localStorage (lyrics come from Sheets)
function loadTimings(){
  try{const s=localStorage.getItem('kpop-timings');if(!s)return;
    const data=JSON.parse(s);
    songs.forEach(song=>{
      const td=data[song.id];if(!td)return;
      song.lines.forEach((line,i)=>{
        if(td[i]){line.time=td[i].time??null;
          line.translation=td[i].tr||line.translation||'';
          if(td[i].wt){line.words.forEach((w,j)=>{if(td[i].wt[j]!==undefined)w.time=td[i].wt[j]})}
        }})})
  }catch(e){}}
function saveTimings(){
  try{const data={};
    songs.forEach(song=>{
      const sd={};
      song.lines.forEach((line,i)=>{
        const hasData=line.time!==null||line.translation||(line.words.some(w=>w.time!==null));
        if(hasData){sd[i]={time:line.time,tr:line.translation||'',wt:line.words.map(w=>w.time)}}});
      if(Object.keys(sd).length)data[song.id]=sd});
    localStorage.setItem('kpop-timings',JSON.stringify(data))
  }catch(e){}}
function save(){saveTimings()}

function renderAll(){if(!songs.length)return;renderLyrics();renderEditor();renderTimingContent();renderSongList();updTitle();showMV()}

function renderHome(){
  const el=document.getElementById('homeSongList');
  if(!songs.length){el.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-dim);font-size:12px">📡 読み込み中...</div>';return}
  const groups={};const noAlbum=[];
  songs.forEach((s,i)=>{if(s.album){if(!groups[s.album])groups[s.album]=[];groups[s.album].push(i)}else{noAlbum.push(i)}});
  let html='';
  const FOLD_MIN=2;
  Object.keys(groups).forEach(album=>{
    const idxs=groups[album];
    if(idxs.length>=FOLD_MIN){
      html+=`<details style="margin-bottom:8px"><summary style="font-size:13px;font-weight:700;padding:10px 0;color:var(--text)">${album} <span style="font-size:11px;color:var(--text-dim)">(${idxs.length}曲)</span></summary>`;
      idxs.forEach(i=>{const s=songs[i];html+=`<div class="home-card" onclick="openSong(${i})"><div class="hc-title">${s.title}</div><div class="hc-artist">${s.artist}</div></div>`});

    }else{
      idxs.forEach(i=>{const s=songs[i];html+=`<div class="home-card" onclick="openSong(${i})"><div class="hc-title">${s.title}</div><div class="hc-artist">${s.artist} · ${s.album}</div></div>`});
    }});
  noAlbum.forEach(i=>{const s=songs[i];html+=`<div class="home-card" onclick="openSong(${i})"><div class="hc-title">${s.title}</div><div class="hc-artist">${s.artist}</div></div>`});

function renderLyrics(){

  c.innerHTML=s.lines.map((l,i)=>{
    const wh=l.words.map((w,j)=>`<div class="word-block pos-${w.pos}" id="wb-${i}-${j}"><div class="word-reading">${w.reading||''}</div><span class="word-text">${w.text}</span><div class="word-meaning">${w.meaning||''}</div></div>`).join('');

  // Reset cached highlight refs since DOM was rebuilt
  _prevActiveLine=null;_prevActiveWord=null;curLine=-1;curWord=-1}

// Sync (optimized: predictive time to beat iOS currentTime lag)
const _pFill=document.getElementById('progressFill');
const _cTime=document.getElementById('currentTime');
const _mvWrap=document.getElementById('mvVideoWrap');
let _lastPct=-1,_lastTimeTxt='',_mvSyncCounter=0;
// Predictive time: track when currentTime last changed and extrapolate
let _lastKnownTime=0,_lastKnownAt=0,_lastRawTime=-1;
function getPredictedTime(){
  const raw=audio.currentTime;
  const now=performance.now()/1000;
  if(raw!==_lastRawTime){_lastKnownTime=raw;_lastKnownAt=now;_lastRawTime=raw}
  if(audio.paused||!_isIOS)return raw;
  // On iOS, predict ahead based on elapsed wall-clock time and playback rate
  const elapsed=(now-_lastKnownAt)*audio.playbackRate;
  return Math.min(_lastKnownTime+elapsed,audio.duration||Infinity);
}
function animLoop(){
  if(audio.src&&audio.duration){
    const ct=getPredictedTime(),dur=audio.duration;
    if(abState===2&&abA!==null&&abB!==null&&ct>=abB){audio.currentTime=abA}
    const pct=((ct/dur)*100).toFixed(1);
    if(pct!==_lastPct){_pFill.style.width=pct+'%';_lastPct=pct}
    const tt=fmt(ct,true);if(tt!==_lastTimeTxt){_cTime.textContent=tt;_lastTimeTxt=tt}
    syncHL(ct);
    // MV sync every 3 frames instead of every frame
    if(++_mvSyncCounter>=3){_mvSyncCounter=0;
      const v=getMV();if(v&&!audio.paused&&_mvWrap.classList.contains('open')){const target=ct+songs[curSong].videoOffset;if(target<0){if(!v.paused)v.pause()}else{if(v.paused)v.play().catch(()=>{});if(Math.abs(v.currentTime-target)>.3){v.currentTime=target}}}}}
  requestAnimationFrame(animLoop)}
requestAnimationFrame(animLoop);
audio.addEventListener('loadedmetadata',()=>document.getElementById('totalTime').textContent=fmt(audio.duration,true));
audio.addEventListener('ended',()=>{if(loopOn){audio.currentTime=0;audio.play();const v=getMV();if(v){v.currentTime=songs[curSong].videoOffset;v.play().catch(()=>{})}}else{syncMV(false);document.getElementById('playBtn').textContent='▶'}});

let _prevActiveWord=null,_prevActiveLine=null;
function syncHL(t){
  const s=songs[curSong];let aL=-1;
  for(let i=s.lines.length-1;i>=0;i--){if(s.lines[i].time!==null&&t>=s.lines[i].time){aL=i;break}}
  let aW=-1;
  if(aL>=0){const ws=s.lines[aL].words;for(let j=ws.length-1;j>=0;j--){if(ws[j].time!==null&&t>=ws[j].time){aW=j;break}}}
  if(aL!==curLine){
    if(_prevActiveLine){_prevActiveLine.classList.remove('active');_prevActiveLine.classList.add('past')}
    if(curLine>=0&&aL>curLine+1){for(let i=curLine+1;i<aL;i++){const el=document.getElementById('line-'+i);if(el){el.classList.remove('future');el.classList.add('past')}}}
    curLine=aL;
    const newEl=aL>=0?document.getElementById('line-'+aL):null;
    if(newEl){
      newEl.classList.remove('past','future');newEl.classList.add('active');
      _prevActiveLine=newEl;
      newEl.scrollIntoView({behavior:'smooth',block:'center'})}
    else{_prevActiveLine=null}
  }
  if(aW!==curWord){
    if(_prevActiveWord){_prevActiveWord.classList.remove('word-active');_prevActiveWord=null}
    if(aL>=0&&aW>=0){const el=document.getElementById(`wb-${aL}-${aW}`);if(el){el.classList.add('word-active');_prevActiveWord=el}}}
  curWord=aW}

// Player
const pw=document.getElementById('progressWrap');
const tooltip=document.getElementById('seekTooltip');
function seekE(e,showTip){
  const r=pw.getBoundingClientRect(),cx=e.touches?e.touches[0].clientX:e.clientX;
  const p=Math.max(0,Math.min(1,(cx-r.left)/r.width));
  if(audio.duration)audio.currentTime=p*audio.duration;
  if(showTip){tooltip.style.display='block';tooltip.textContent=fmt(audio.currentTime,true);tooltip.style.left=Math.max(0,Math.min(r.width-40,(cx-r.left)-20))+'px'}}
function hideTooltip(){tooltip.style.display='none'}
pw.addEventListener('click',e=>{seekE(e,true);setTimeout(hideTooltip,800)});let drag=false;
pw.addEventListener('touchstart',e=>{drag=true;seekE(e,true)},{passive:true});
pw.addEventListener('touchmove',e=>{if(drag)seekE(e,true)},{passive:true});
pw.addEventListener('touchend',()=>{drag=false;setTimeout(hideTooltip,500)});

function getMV(){const el=document.getElementById('mvVideoWrap');return el?el.querySelector('video'):null}
function syncMV(playing){const v=getMV();if(!v)return;const wrap=document.getElementById('mvVideoWrap');if(!wrap.classList.contains('open'))return;if(playing){const target=audio.currentTime+songs[curSong].videoOffset;if(target<0){v.currentTime=0;v.pause()}else{v.currentTime=target;v.play().catch(()=>{})}}else{v.pause()}}
const _isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1;
function togglePlay(){if(!audio.src){document.getElementById('audioFileInput').click();return}if(audio.paused){audio.play();syncMV(true);document.getElementById('playBtn').textContent='⏸'}else{audio.pause();syncMV(false);document.getElementById('playBtn').textContent='▶'}}
function changeSpeed(dir){speedIdx=Math.max(0,Math.min(speeds.length-1,speedIdx+dir));const spd=speeds[speedIdx];audio.playbackRate=spd;
  audio.preservesPitch=true;audio.webkitPreservesPitch=true;
  // iOS pitch correction boosts gain ~1.7x at slow speeds — compensate to prevent distortion
  if(_isIOS&&spd<1){audio.volume=spd===0.5?0.55:0.5}else{audio.volume=1}
  const v=getMV();if(v){v.playbackRate=spd;v.preservesPitch=true;v.webkitPreservesPitch=true}
  document.getElementById('speedDisplay').textContent=spd+'×'}

function toggleOpt(){document.getElementById('optPanel').classList.toggle('open')}

function toggleLoop(){loopOn=!loopOn;document.getElementById('loopBtn').classList.toggle('on',loopOn)}

function toggleAB(){
  if(abState===0){abA=audio.currentTime;abB=null;abState=1;document.getElementById('abBtn').classList.add('on');document.getElementById('abBtn').textContent='🅱️ 終点を設定';document.getElementById('abInfo').textContent='A: '+fmt(abA,true)}
  else if(abState===1){abB=audio.currentTime;if(abB<=abA){abB=null;return}abState=2;document.getElementById('abBtn').textContent='✖ 解除';document.getElementById('abInfo').textContent='A: '+fmt(abA,true)+' → B: '+fmt(abB,true);audio.currentTime=abA}
  else{abState=0;abA=null;abB=null;document.getElementById('abBtn').classList.remove('on');document.getElementById('abBtn').textContent='🅰️🅱️ 区間';document.getElementById('abInfo').textContent=''}}

function togglePosFilter(pos){
  if(hiddenPos.has(pos)){hiddenPos.delete(pos)}else{hiddenPos.add(pos)}
  renderLegend();applyPosFilter()}
function applyPosFilter(){
  // Use a dynamic style rule instead of iterating all word-block elements
  let styleEl=document.getElementById('posFilterStyle');
  if(!styleEl){styleEl=document.createElement('style');styleEl.id='posFilterStyle';document.head.appendChild(styleEl)}
  styleEl.textContent=[...hiddenPos].map(p=>`.word-block.pos-${p} .word-reading,.word-block.pos-${p} .word-meaning{visibility:hidden}`).join('')}

document.getElementById('audioFileInput').addEventListener('change',async function(e){
  const f=e.target.files[0];if(!f)return;
  audio.src=URL.createObjectURL(f);audio.load();mp3Loaded=true;
  await saveAudioDB(songs[curSong].id,f);checkMP3()});

// Editor
function renderEditor(){
  const c=document.getElementById('editLines'),s=songs[curSong];
  c.innerHTML=s.lines.map((l,i)=>{
    const prev=l.words.map(w=>w.text).join('');
    const open=editLineIdx===i;
    return `<div class="e-card"><div class="e-header"><span class="e-num">#${i+1}</span><div class="btn-row">${i>0?`<button class="btn-s" onclick="mvLine(${i},-1)">▲</button>`:''} ${i<s.lines.length-1?`<button class="btn-s" onclick="mvLine(${i},1)">▼</button>`:''}<button class="btn-s" onclick="edLine(${i})">${open?'閉':'編集'}</button><button class="btn-s dan" onclick="delLine(${i})">×</button></div></div><div class="e-preview">${prev}</div><div class="e-trans">${l.translation||''}</div>${open?lineEd(i):''}</div>`}).join('')}

function lineEd(li){
  const l=songs[curSong].lines[li];
  const chips=l.words.map((w,wi)=>`<div class="w-chip ${editWordIdx===wi?'sel':''}" onclick="selW(${li},${wi})"><span>${w.text||'(空)'}</span><span style="display:flex;gap:1px">${wi>0?`<span class="arr" onclick="event.stopPropagation();mvW(${li},${wi},-1)">◀</span>`:''} ${wi<l.words.length-1?`<span class="arr" onclick="event.stopPropagation();mvW(${li},${wi},1)">▶</span>`:''}</span></div>`).join('');
  let we='';
  if(editWordIdx!==null&&l.words[editWordIdx]){const w=l.words[editWordIdx];
    we=`<div style="margin-top:6px;padding:8px;background:var(--bg);border-radius:8px"><input class="e-input" value="${esc(w.text)}" placeholder="韓国語" onchange="upW(${li},${editWordIdx},'text',this.value)"><input class="e-input" value="${esc(w.reading)}" placeholder="読み（カタカナ）" onchange="upW(${li},${editWordIdx},'reading',this.value)"><input class="e-input" value="${esc(w.meaning)}" placeholder="意味（～を、～に等）" onchange="upW(${li},${editWordIdx},'meaning',this.value)"><select class="e-input" onchange="upW(${li},${editWordIdx},'pos',this.value)">${Object.entries(POS).map(([k,v])=>`<option value="${k}"${w.pos===k?' selected':''}>${v.l}</option>`).join('')}</select><div class="btn-row"><button class="btn-s" onclick="insW(${li},${editWordIdx})">↑前に挿入</button><button class="btn-s" onclick="insW(${li},${editWordIdx}+1)">↓後に挿入</button><button class="btn-s dan" onclick="rmW(${li},${editWordIdx})">削除</button></div></div>`}
  return `<div style="margin-top:6px;border-top:1px solid var(--border);padding-top:6px"><input class="e-input" value="${esc(l.translation||'')}" placeholder="和訳" onchange="songs[${curSong}].lines[${li}].translation=this.value;save();renderLyrics()"><div class="word-chips">${chips}<div class="w-chip" onclick="insW(${li},${songs[curSong].lines[li].words.length})" style="color:var(--accent);border-color:var(--accent)">＋</div></div>${we}</div>`}

function edLine(i){editLineIdx=editLineIdx===i?null:i;editWordIdx=null;renderEditor()}
function selW(li,wi){editWordIdx=editWordIdx===wi?null:wi;renderEditor()}
function upW(li,wi,f,v){songs[curSong].lines[li].words[wi][f]=v;save();renderLyrics();renderEditor()}
function mvW(li,wi,d){const ws=songs[curSong].lines[li].words,ni=wi+d;if(ni<0||ni>=ws.length)return;[ws[wi],ws[ni]]=[ws[ni],ws[wi]];editWordIdx=ni;save();renderEditor();renderLyrics()}

// Korean particle auto-split rules (longest match first)
const PARTICLES=[
  {p:'에서',m:'～で'},{p:'에게',m:'～に(人)'},{p:'부터',m:'～から'},{p:'까지',m:'～まで'},{p:'처럼',m:'～のように'},{p:'마다',m:'～ごと'},{p:'보다',m:'～より'},{p:'밖에',m:'～しか'},{p:'한테',m:'～に(人)'},
  {p:'는',m:'～は'},{p:'은',m:'～は'},{p:'를',m:'～を'},{p:'을',m:'～を'},{p:'가',m:'～が'},{p:'이',m:'～が'},{p:'의',m:'～の'},{p:'에',m:'～に'},{p:'도',m:'～も'},{p:'로',m:'～で/へ'},{p:'과',m:'～と'},{p:'와',m:'～と'},{p:'랑',m:'～と'},{p:'만',m:'～だけ'},{p:'야',m:'～よ'},{p:'아',m:'～よ'},{p:'요',m:'～です'}
];
// Endings to split
const ENDINGS=[
  {p:'습니다',m:'～ます'},{p:'ㅂ니다',m:'～ます'},{p:'세요',m:'～てください'},{p:'니까',m:'～だから'},{p:'지만',m:'～けど'},{p:'면서',m:'～しながら'},{p:'으면',m:'～なら'},{p:'겠지',m:'～でしょう'},
  {p:'지',m:'～でしょ'},{p:'고',m:'～して'},{p:'며',m:'～しつつ'},{p:'면',m:'～なら'},{p:'서',m:'～して'}
];
function isHangul(c){const code=c.charCodeAt(0);return code>=0xAC00&&code<=0xD7AF||code>=0x3131&&code<=0x318E}

function splitKoreanWord(txt){
  // Don't split single char or very short
  if(txt.length<=1||!isHangul(txt.charAt(0)))return[{text:txt,pos:'noun',meaning:''}];
  // Try particle split (from end)
  for(const rule of PARTICLES){
    if(txt.length>rule.p.length&&txt.endsWith(rule.p)){
      const stem=txt.slice(0,-rule.p.length);
      if(stem.length>=1)return[{text:stem,pos:'noun',meaning:''},{text:rule.p,pos:'particle',meaning:rule.m}];
    }
  }
  // Try ending split
  for(const rule of ENDINGS){
    if(txt.length>rule.p.length&&txt.endsWith(rule.p)){
      const stem=txt.slice(0,-rule.p.length);
      if(stem.length>=1)return[{text:stem,pos:'verb',meaning:''},{text:rule.p,pos:'ending',meaning:rule.m}];
    }
  }
  return[{text:txt,pos:'noun',meaning:''}];
}
function splitLineWords(line){
  const parts=line.trim().split(/\s+/);
  const result=[];
  for(const p of parts){
    if(/^[a-zA-Z''?!.,\-]+$/.test(p)){result.push({text:p,reading:'',meaning:'',pos:'eng',time:null})}
    else{const splits=splitKoreanWord(p);for(const s of splits){result.push({text:s.text,reading:'',meaning:s.meaning,pos:s.pos,time:null})}}
  }
  return result;
}
function doPaste(mode){
  const t=document.getElementById('pasteArea').value.trim();if(!t)return;
  const ls=t.split('\n').filter(l=>l.trim());
  const newLines=ls.map(l=>({time:null,translation:'',words:splitLineWords(l)}));
  if(mode==='append'){songs[curSong].lines=songs[curSong].lines.concat(newLines)}
  else{songs[curSong].lines=newLines}
  save();closeM();editLineIdx=editWordIdx=null;renderAll();
  const modeText=mode==='append'?'追加':'上書き';
  alert(`${ls.length}行を${modeText}しました！\n助詞（는/을/에 等）は自動分離済み。\n歌詞編集タブで確認・修正してください。`)}

function showHelp(){
  const hs=document.getElementById('helpScreen');
  hs.style.display='block';
  // Nav buttons
  document.getElementById('helpNav').innerHTML=helpSections.map((s,i)=>
    `<button class="help-nav-btn${i===0?' active':''}" onclick="scrollHelpTo('${s.id}')">${s.title.split(' ').slice(1).join(' ')}</button>`).join('');
  // Content
  document.getElementById('helpBody').innerHTML=helpSections.map(s=>
    `<div class="help-sec" id="help-${s.id}"><h3>${s.title}</h3>${s.content}</div>`).join('');
  // Scroll spy for nav
  hs.onscroll=()=>{
    const tops=helpSections.map(s=>({id:s.id,top:document.getElementById('help-'+s.id)?.getBoundingClientRect().top||999}));
    let active=tops[0].id;
    for(const t of tops){if(t.top<150)active=t.id}
    document.querySelectorAll('.help-nav-btn').forEach((b,i)=>b.classList.toggle('active',helpSections[i].id===active));
  };
}
function scrollHelpTo(id){document.getElementById('help-'+id)?.scrollIntoView({behavior:'smooth',block:'start'})}
function closeHelp(){document.getElementById('helpScreen').style.display='none'}

// Timing
function setTimingMode(m){timingMode=m;document.querySelectorAll('.sub-tab').forEach((el,i)=>el.classList.toggle('active',i===(m==='line'?0:1)));renderTimingContent()}
function renderTimingContent(){const c=document.getElementById('timingContent');if(timingMode==='line')renderLT(c);else renderWT(c)}

function renderLT(c){
  const s=songs[curSong];
  c.innerHTML=s.lines.map((l,i)=>{
    const prev=l.words.map(w=>w.text).join(' ');const ts=l.time!==null?fmt(l.time,true):'';
    return `<div class="t-line"><span class="t-text">${prev}</span><input class="t-time-input" value="${ts}" placeholder="--:--" onchange="setLT(${i},this.value)" inputmode="decimal"><button class="t-btn" onclick="tapLT(${i})">TAP</button><button class="t-btn" onclick="clrLT(${i})" style="color:#ef4444;border-color:#ef4444">×</button></div>`}).join('')+`<div class="btn-row" style="margin-top:8px"><button class="btn-s dan" onclick="clrAllLT()">全リセット</button></div>`}

function renderWT(c){
  const s=songs[curSong];let h='';
  s.lines.forEach((l,i)=>{
    const prev=l.words.map(w=>w.text).join(' ');
    const isOpen=wtOpenLines.has(i);
    h+=`<div class="e-card" style="cursor:pointer"><div onclick="toggleWTLine(${i})" style="font-size:12px;padding:2px 0"><span style="color:var(--accent)">${isOpen?'▾':'▸'}</span> #${i+1} ${prev}</div>`;
    if(isOpen){
      h+=`<div style="margin-top:6px">`;
      l.words.forEach((w,j)=>{const ts=w.time!==null?fmt(w.time,true):'';
        h+=`<div style="display:flex;align-items:center;gap:4px;margin-bottom:3px"><span class="pos-${w.pos}" style="flex:1;font-size:11px"><span class="word-text" style="font-size:12px;padding:2px 5px">${w.text}</span></span><input class="t-time-input" value="${ts}" placeholder="--:--" onchange="setWT(${i},${j},this.value)" inputmode="decimal" style="width:50px"><button class="t-btn" onclick="tapWT(${i},${j})">TAP</button><button class="t-btn" onclick="clrWT(${i},${j})" style="color:#ef4444;border-color:#ef4444;padding:3px 5px">×</button></div>`});
      h+=`</div>`}
    h+=`</div>`});
  c.innerHTML=h}

let tapTimer=null;
function deferRender(){clearTimeout(tapTimer);tapTimer=setTimeout(()=>{save();renderTimingContent()},300)}
function tapLT(i){if(!audio.src)return alert('先にMP3を読み込んでね');songs[curSong].lines[i].time=audio.currentTime;deferRender()}
function setLT(i,v){songs[curSong].lines[i].time=parseT(v);save();renderTimingContent()}
function clrLT(i){songs[curSong].lines[i].time=null;save();renderTimingContent()}
function clrAllLT(){songs[curSong].lines.forEach(l=>l.time=null);save();renderTimingContent();renderLyrics()}
let wtOpenLines=new Set();
function toggleWTLine(i){if(wtOpenLines.has(i))wtOpenLines.delete(i);else wtOpenLines.add(i);renderTimingContent()}
function tapWT(i,j){if(!audio.src)return alert('先にMP3を読み込んでね');songs[curSong].lines[i].words[j].time=audio.currentTime;deferRender()}
function setWT(i,j,v){songs[curSong].lines[i].words[j].time=parseT(v);save();renderTimingContent()}
function clrWT(i,j){songs[curSong].lines[i].words[j].time=null;save();renderTimingContent()}
function skip(sec){if(audio.src)audio.currentTime=Math.max(0,Math.min(audio.duration||0,audio.currentTime+sec))}
function seekToLine(i){const t=songs[curSong].lines[i]?.time;if(t!==null&&audio.src){audio.currentTime=t;if(audio.paused){audio.play();syncMV(true);document.getElementById('playBtn').textContent='⏸'}}}
function parseT(v){if(!v||v==='--:--')return null;if(v.includes(':')){const[m,s]=v.split(':');return parseInt(m)*60+parseFloat(s)}return parseFloat(v)||null}

// Songs
function renderSongList(){
  document.getElementById('songList').innerHTML=songs.map((s,i)=>`<div class="song-item ${i===curSong?'current':''}" onclick="selSong(${i})"><span class="s-name">${s.title} — ${s.artist}</span></div>`).join('');
  checkMP3()}
function selSong(i){openSong(i)}
function exportAllData(){
  const song=songs[curSong];
  if(!song){document.getElementById('exportStatus').textContent='曲を選択してください';return}
  const data={songId:song.id,title:song.title,artist:song.artist,lines:song.lines.map((line,i)=>({
    line:i+1,time:line.time,translation:line.translation||'',bgText:line.bgText||'',
    words:line.words.map(w=>({text:w.text,reading:w.reading||'',meaning:w.meaning||'',pos:w.pos||'noun',time:w.time}))}))};
  const txt=JSON.stringify(data);
  navigator.clipboard.writeText(txt).then(()=>{
    alert('✅ コピーしました！Claudeに貼り付けてね');
  }).catch(()=>{
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    alert('✅ コピーしました！Claudeに貼り付けてね')})}

function switchTab(tab){document.querySelectorAll('.tab').forEach(t=>{if(t.dataset.tab)t.classList.toggle('active',t.dataset.tab===tab)});document.querySelectorAll('.tab-content').forEach(tc=>tc.style.display='none');document.getElementById('tab-'+tab).style.display='block';if(tab!=='play'){const wrap=document.getElementById('mvVideoWrap');if(wrap&&wrap.classList.contains('open')){wrap.classList.remove('open');const v=wrap.querySelector('video');if(v)v.pause();const toggle=document.querySelector('.mv-toggle');if(toggle)toggle.style.display='';document.getElementById('mvToggleIcon').textContent='▸'}}if(tab==='timing')renderTimingContent();if(tab==='edit')renderEditor();if(tab==='songs'){renderSongList();checkMP3()}window.scrollTo(0,0)}
function fmt(s,precise){if(s==null)return'0:00';const m=Math.floor(s/60),sc=Math.floor(s%60),cs=Math.floor((s%1)*100);return precise?m+':'+(sc<10?'0':'')+sc+'.'+( cs<10?'0':'')+cs:m+':'+(sc<10?'0':'')+sc}
function esc(s){return(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;')}

init();
</script>
